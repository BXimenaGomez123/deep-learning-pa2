[project]
name = "deep-learning-pa2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nmspaniol", email = "nicolasmspaniol@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyqt6>=6.11.0",
    "pytest>=9.1.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pa2"

[tool.pytest.ini_options]
testpaths = ["tests"]
